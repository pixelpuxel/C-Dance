server {
    listen 80;
    listen [::]:80;
    server_name cdance.schreiber.info;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdance.schreiber.info;

    ssl_certificate /etc/letsencrypt/live/cdance.schreiber.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdance.schreiber.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 320m;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;

    location / {
        proxy_pass http://127.0.0.1:8193;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}
